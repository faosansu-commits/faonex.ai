services:
  mysql:
    image: mariadb:11
    container_name: ai-chatbot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-faonex_root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-faonex}
      MYSQL_USER: ${DB_USER:-faonex}
      MYSQL_PASSWORD: ${DB_PASSWORD:-faonex_change_me}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - chatbot-net

  # หน้าเว็บจัดการฐานข้อมูล สำหรับผู้ดูแลระบบ — เข้าที่ http://<โฮสต์>:8096
  # ล็อกอินด้วย DB_USER/DB_PASSWORD (หรือ root/DB_ROOT_PASSWORD) จาก .env
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ai-chatbot-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8096:80"
    restart: unless-stopped
    networks:
      - chatbot-net

  ollama:
    image: ollama/ollama:latest
    container_name: ai-chatbot-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - chatbot-net

  # ดาวน์โหลดโมเดลให้อัตโนมัติตอนเริ่มระบบครั้งแรก (ทำงานครั้งเดียวแล้วจบ)
  ollama-init:
    image: ollama/ollama:latest
    container_name: ai-chatbot-ollama-init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-llama3.2} && ollama pull ${OLLAMA_CODE_MODEL:-qwen2.5-coder:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - chatbot-net

  backend:
    build: ./backend
    container_name: ai-chatbot-backend
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_CODE_MODEL: ${OLLAMA_CODE_MODEL:-qwen2.5-coder:3b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava-phi3}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      APP_RAG_TOP_K: ${APP_RAG_TOP_K:-4}
      APP_RAG_SIMILARITY_THRESHOLD: ${APP_RAG_SIMILARITY_THRESHOLD:-0.35}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      OLLAMA_STREAM_TIMEOUT: ${OLLAMA_STREAM_TIMEOUT:-600}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:--1}
      APP_ORG_NAME: ${APP_ORG_NAME:-องค์กรของเรา}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-faonex}
      DB_USER: ${DB_USER:-faonex}
      DB_PASSWORD: ${DB_PASSWORD:-faonex_change_me}
      APP_DEFAULT_DAILY_REQUEST_LIMIT: ${APP_DEFAULT_DAILY_REQUEST_LIMIT:-100}
      APP_DEFAULT_DAILY_TOKEN_LIMIT: ${APP_DEFAULT_DAILY_TOKEN_LIMIT:-20000}
    volumes:
      # อ่านอย่างเดียว (read-only) ใช้สำหรับหน้า Dashboard แอดมินดู CPU/RAM/Disk ของโฮสต์เท่านั้น
      - /proc:/host/proc:ro
      - /:/host/rootfs:ro
    depends_on:
      ollama:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chatbot-net

  web:
    build: ./frontend
    container_name: ai-chatbot-web
    depends_on:
      - backend
    ports:
      - "8095:80"
    restart: unless-stopped
    networks:
      - chatbot-net

networks:
  chatbot-net:
    driver: bridge

volumes:
  ollama_data:
  mysql_data:
