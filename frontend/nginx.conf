server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:80;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ยาวพอสำหรับตอนดาวน์โหลดโมเดล AI ครั้งแรก (POST /api/models/pull อาจใช้เวลาหลายนาที)
        proxy_read_timeout 1800s;
        client_max_body_size 24m;
        # ปิด buffering เพื่อให้คำตอบแชทที่ stream มาจาก backend ทีละคำ (NDJSON) ถึงเบราว์เซอร์ทันที ไม่ต้องรอครบก่อน
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
